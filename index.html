<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Library</title>
  <meta name="description" content="A library of website and section screenshots grouped by design style, with the vocabulary to describe each one.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;1,200&family=Inter+Tight:wght@300;400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead__inner">
      <div>
        <p class="eyebrow">inspiration index, vol. 01</p>
        <h1 class="masthead__title">Style <em>Library</em></h1>
        <p class="masthead__lede">Sites and sections grouped by visual language, with the words to describe them and a prompt to recreate the imagery.</p>
      </div>
      <div class="masthead__tools">
        <label class="search">
          <span class="sr-only">Search</span>
          <input id="search" type="search" placeholder="Search titles, tags, vocabulary" autocomplete="off">
        </label>
        <button class="btn btn--lime" id="addBtn" type="button">+ Add entry</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="chips" id="chips" aria-label="Filter by style"></nav>
    <section id="guide" class="guide" hidden></section>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="vocab" class="vocab" hidden></section>
    <p id="empty" class="empty" hidden>Nothing matches that search.</p>
  </main>

  <footer class="site-foot">
    <div class="wrap foot">
      <span>Add entries in <code>data/library.json</code>, screenshots in <code>shots/</code>.</span>
      <span id="count"></span>
    </div>
  </footer>

  <dialog id="modal" class="modal"></dialog>
  <dialog id="addModal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
